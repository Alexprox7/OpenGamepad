# Xcode project description for XcodeGen (`brew install xcodegen && xcodegen generate`).
name: OpenGamepad
options:
  bundleIdPrefix: org.opengamepad
  deploymentTarget:
    iOS: "16.0"
targets:
  OpenGamepad:
    type: application
    platform: iOS
    sources: [OpenGamepad]
    info:
      path: OpenGamepad/Info.plist
      properties:
        CFBundleDisplayName: OpenGamepad
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: OpenGamepad looks for the companion and the Switch sysmodule on your Wi-Fi network and sends the controller input to them.
        CFBundleURLTypes:
          - CFBundleURLName: org.opengamepad.connect
            CFBundleURLSchemes: [opengamepad]
        GCSupportsControllerUserInteraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opengamepad.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
